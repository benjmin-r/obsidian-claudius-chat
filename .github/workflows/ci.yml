name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint (Obsidian's official review rules)
        run: npm run lint

      - name: Test (all workspaces, enforces coverage thresholds)
        run: npm run test:coverage

      - name: Build (protocol + server + plugin)
        run: npm run build
