version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript up to 6, and the plugin targets ES2018.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and the docs target Node 20; keep the type definitions in step with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
